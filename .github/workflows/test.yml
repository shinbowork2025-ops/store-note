name: Test

on:
  pull_request:
  push:
    branches: ['codex/**']

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install test dependencies
        run: npm install --no-save playwright@1.56.1 fake-indexeddb esbuild jsdom
      - name: Install browser
        run: npx playwright install --with-deps chromium
      - name: Data and UI regression
        run: |
          node tests/data-regression.mjs
          node tests/ui-regression.cjs
      - name: Browser smoke tests
        run: |
          python3 -m http.server 8123 > "$RUNNER_TEMP/store-note-server.log" 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          export CHROME_PATH="$(node -e "process.stdout.write(require('playwright').chromium.executablePath())")"
          node tests/smoke.js
          node tests/smoke-backup.js
